# yaml-language-server: $schema=https://json.schemastore.org/semantic-release.json
---
branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: fix
          scope: README
          release: patch
        - type: build
          release: patch
        - type: refactor
          release: patch
        - type: feat
          release: minor
  - - "@semantic-release/release-notes-generator"
    - writerOpts:
        commitsSort:
          - subject
          - scope
      preset: conventionalcommits
      presetConfig:
        types:
          - type: "feat"
            section: "Features"
          - type: "fix"
            section: "Bug Fixes"
          - type: "perf"
            section: "Performance Improvements"
          - type: "revert"
            section: "Reverts"
          - type: "docs"
            section: "Documentation"
          - type: "style"
            section: "Styles"
            hidden: true
          - type: "chore"
            section: "Miscellaneous Chores"
            hidden: true
          - type: "refactor"
            section: "Code Refactoring"
          - type: "test"
            section: "Tests"
            hidden: true
          - type: "build"
            section: "Build System"
          - type: "ci"
            section: "Continuous Integration"
            hidden: true
        issuePrefixes: ["W-", "Work", "@W-"]
        issueUrlFormat: "https://gus.my.salesforce.com/apex/ADM_WorkLocator?bugorworknumber=W-{{id}}"
  - - "@semantic-release/npm"
    - npmPublish: false # We publish via separate step using OIDC (no token)
  - "@semantic-release/github" # Publishes to GitHub

preset: conventionalcommits
