name: Release o11y-reporter
on:
  # Releases are paused while the open-source request is pending. Restore the
  # `push` trigger below once the open-source release is approved.
  #
  # push:
  #   branches: ["main"]
  #   paths-ignore:
  #     - ".gitignore"
  #     - "CODEOWNERS"
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  release:
    strategy:
      matrix:
        node-version: [22.x]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # For GitHub releases and tags
      pull-requests: read # For @semantic-release/github (associated PRs)
      issues: write # For @semantic-release/github success step (comment on PR)
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.9.0

      - run: yarn install
      - run: yarn format:ci
      - run: yarn eslint:ci
      - run: yarn package

      # Version, tag, and GitHub release only (npm publish disabled in .releaserc).
      - run: yarn semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release only writes the version when it cuts a release. Without
      # this check, a run with no releasable commits would publish the
      # placeholder version below.
      - name: Check whether a new version was released
        id: release-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0-semantically-released" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild so dist matches the new version.
      - run: yarn package
        if: steps.release-check.outputs.released == 'true'
      - name: Publish to npm
        if: steps.release-check.outputs.released == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the workspace sub-package. It is versioned on its own: bump the
      # version in packages/o11y-agent-stream/package.json to release it, and it
      # goes out with the next root release. A version that is already on npm is
      # skipped, so a failed publish is retried on the next release.
      #
      # It carries a `workspace:^` dependency on the root package, so it must
      # publish via `yarn npm publish`, which rewrites that to `^<root version>`
      # — plain `npm publish` would ship the literal protocol string and break
      # installs. The rewrite reads the root version semantic-release just
      # wrote, which is why this step only runs when the root released.
      # token auth — yarn 4.1.1 predates OIDC (added in 4.10.0); also bootstraps
      # the first publish. Unlike the root's `npm publish` above, this step gets
      # no provenance attestation and depends on NPM_TOKEN staying alive.
      #
      # Follow-up for parity with the root (non-blocking, and it removes the
      # risk of a revoked token breaking this step): bump `packageManager` to
      # yarn@4.10.0+, register @salesforce/o11y-agent-stream as its own trusted
      # publisher on npmjs.com, then drop YARN_NPM_AUTH_TOKEN.
      - name: Publish o11y-agent-stream to npm
        if: steps.release-check.outputs.released == 'true'
        run: |
          VERSION=$(node -p "require('./packages/o11y-agent-stream/package.json').version")
          if curl -sf -o /dev/null "https://registry.npmjs.org/@salesforce%2fo11y-agent-stream/$VERSION"; then
            echo "@salesforce/o11y-agent-stream@$VERSION is already on npm; skipping."
            exit 0
          fi
          yarn workspace @salesforce/o11y-agent-stream build
          yarn workspace @salesforce/o11y-agent-stream npm publish --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
