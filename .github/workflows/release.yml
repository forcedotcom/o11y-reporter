name: Release o11y-reporter
on:
  # Releases are paused while the open-source request is pending. Restore the
  # `push` trigger below once the open-source release is approved.
  #
  # push:
  #   branches: ["main"]
  #   paths-ignore:
  #     - ".gitignore"
  #     - "CODEOWNERS"
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  release:
    strategy:
      matrix:
        node-version: [22.x]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # For GitHub releases and tags
      pull-requests: read # For @semantic-release/github (associated PRs)
      issues: write # For @semantic-release/github success step (comment on PR)
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.9.0

      # Both packages publish through npm trusted publishing (OIDC), and a
      # missing or mismatched trusted publisher only shows up at `npm publish`,
      # after semantic-release has already pushed the tag and GitHub release.
      # Run the same OIDC token exchange `npm publish` does, for each package
      # this run could publish, so a bad config stops the run before anything
      # is tagged. The short-lived token it returns is discarded.
      - name: Check npm trusted publishing
        run: |
          ID_TOKEN=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          check() {
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ID_TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$1")
            case "$STATUS" in
              2??) echo "$1: trusted publishing OK" ;;
              *)
                echo "::error::OIDC token exchange for $1 returned HTTP $STATUS. Check its trusted publisher on npmjs.com (forcedotcom/o11y-reporter, release.yml)."
                exit 1
                ;;
            esac
          }
          check "@salesforce%2fo11y-reporter"
          VERSION=$(node -p "require('./packages/o11y-agent-stream/package.json').version")
          if ! curl -sf -o /dev/null "https://registry.npmjs.org/@salesforce%2fo11y-agent-stream/$VERSION"; then
            check "@salesforce%2fo11y-agent-stream"
          fi

      - run: yarn install
      - run: yarn format:ci
      - run: yarn eslint:ci
      - run: yarn package

      # Version, tag, and GitHub release only (npm publish disabled in .releaserc).
      - run: yarn semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release only writes the version when it cuts a release. Without
      # this check, a run with no releasable commits would publish the
      # placeholder version below.
      - name: Check whether a new version was released
        id: release-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0-semantically-released" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild so dist matches the new version.
      - run: yarn package
        if: steps.release-check.outputs.released == 'true'
      # Authenticates through npm trusted publishing (OIDC), no token. Because
      # the repo is public, npm also attaches a provenance attestation, which
      # it only accepts when package.json `repository.url` matches this repo.
      - name: Publish to npm
        if: steps.release-check.outputs.released == 'true'
        run: npm publish --access public

      # Publish the workspace sub-package. It is versioned on its own: bump the
      # version in packages/o11y-agent-stream/package.json to release it, and it
      # goes out with the next root release. A version that is already on npm is
      # skipped, so a failed publish is retried on the next release.
      #
      # It carries a `workspace:^` dependency on the root package. `yarn pack`
      # rewrites that to `^<root version>` — publishing the directory with npm
      # would ship the literal protocol string and break installs. The rewrite
      # reads the root version semantic-release just wrote, which is why this
      # step only runs when the root released. The tarball is then published
      # with npm, not `yarn npm publish`, because yarn 4.1.1 predates OIDC
      # (added in 4.10.0); this way it uses trusted publishing like the root.
      - name: Publish o11y-agent-stream to npm
        if: steps.release-check.outputs.released == 'true'
        run: |
          VERSION=$(node -p "require('./packages/o11y-agent-stream/package.json').version")
          if curl -sf -o /dev/null "https://registry.npmjs.org/@salesforce%2fo11y-agent-stream/$VERSION"; then
            echo "@salesforce/o11y-agent-stream@$VERSION is already on npm; skipping."
            exit 0
          fi
          yarn workspace @salesforce/o11y-agent-stream build
          yarn workspace @salesforce/o11y-agent-stream pack --out "$RUNNER_TEMP/o11y-agent-stream.tgz"
          npm publish "$RUNNER_TEMP/o11y-agent-stream.tgz" --access public
